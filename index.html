<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlitCam</title>
<style>
  :root { --bg:#fff; --fg:#111; --line:#ccc; --accent:#111; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
               font-family: Arial, sans-serif; font-size: 14px; }
  body { display: flex; flex-direction: column; }
  #panel { padding: 8px 12px; border-bottom: 1px solid var(--line); background: #f7f7f7;
           display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
  .group { display: flex; align-items: center; gap: 8px; }
  .group label { white-space: nowrap; }
  .group output { min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 130px; }
  select, button { font-size: 14px; padding: 5px 10px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border: 1px solid var(--accent); border-radius: 4px; }
  button.primary.on { background: #b00; border-color: #b00; }
  #swatch { width: 22px; height: 22px; border: 1px solid #888; border-radius: 3px; }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
           background: #e9e9e9; overflow: hidden; }
  canvas { max-width: 100%; max-height: 100%; background: #fff; }
  video { display: none; }
  #status { padding: 4px 12px; font-size: 12px; color: #555; border-top: 1px solid var(--line); background: #f7f7f7; }
  #status.err { color: #b00; }
</style>
</head>
<body>

<div id="panel">
  <div class="group">
    <button id="btnStart" class="primary">Avvia</button>
    <button id="btnClear">Cancella</button>
    <button id="btnSave">Salva PNG</button>
  </div>

  <div class="group">
    <label for="selCam">Fotocamera</label>
    <select id="selCam"><option value="">Predefinita</option></select>
  </div>

  <div class="group">
    <label for="selMode">Acquisizione</label>
    <select id="selMode">
      <option value="col">Colonna (fessura verticale, scorre in orizzontale)</option>
      <option value="row">Riga (fessura orizzontale, scorre in verticale)</option>
    </select>
  </div>

  <div class="group">
    <label for="rngTime">Tempo (ms)</label>
    <input id="rngTime" type="range" min="1" max="500" step="1" value="1">
    <output id="outTime">1</output>
  </div>

  <div class="group">
    <label for="rngFascia">Fascia (px)</label>
    <input id="rngFascia" type="range" min="1" max="200" step="1" value="1">
    <output id="outFascia">1</output>
  </div>

  <div class="group">
    <label for="rngR">R</label>
    <input id="rngR" type="range" min="0" max="255" value="255"><output id="outR">255</output>
    <label for="rngG">G</label>
    <input id="rngG" type="range" min="0" max="255" value="255"><output id="outG">255</output>
    <label for="rngB">B</label>
    <input id="rngB" type="range" min="0" max="255" value="255"><output id="outB">255</output>
    <span id="swatch" title="Tinta"></span>
  </div>
</div>

<div id="stage"><canvas id="out" width="1200" height="400"></canvas></div>
<div id="status">Pronto. Premi Avvia per attivare la fotocamera. Scorciatoie: spazio = avvia/arresta, s = salva, c = cancella.</div>
<video id="cam" playsinline muted></video>

<script>
(() => {
  const BUF_LEN = 3000;            // lunghezza dell'immagine nella direzione di scorrimento

  const $ = (id) => document.getElementById(id);
  const video = $('cam');
  const out = $('out');
  const ctx = out.getContext('2d');
  const acc = document.createElement('canvas');   // immagine grezza, senza tinta
  const actx = acc.getContext('2d');

  const ui = {
    start: $('btnStart'), clear: $('btnClear'), save: $('btnSave'),
    cam: $('selCam'), mode: $('selMode'),
    time: $('rngTime'), fascia: $('rngFascia'),
    r: $('rngR'), g: $('rngG'), b: $('rngB'),
    status: $('status'), swatch: $('swatch')
  };

  let running = false;
  let stream = null;
  let lastShift = 0;
  let rafId = 0;
  let hasAlloc = false;

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const val = (el) => parseInt(el.value, 10);
  const isCol = () => ui.mode.value === 'col';

  function setStatus(msg, isErr) {
    ui.status.textContent = msg;
    ui.status.className = isErr ? 'err' : '';
  }

  // ---- parametri / interfaccia ------------------------------------------------
  function syncOutputs() {
    $('outTime').textContent = ui.time.value;
    $('outFascia').textContent = ui.fascia.value;
    $('outR').textContent = ui.r.value;
    $('outG').textContent = ui.g.value;
    $('outB').textContent = ui.b.value;
    ui.swatch.style.background = `rgb(${ui.r.value},${ui.g.value},${ui.b.value})`;
  }

  // la fascia non può superare la dimensione della camera lungo la fessura
  function updateFasciaMax() {
    const span = isCol() ? (video.videoWidth || 200) : (video.videoHeight || 200);
    const max = Math.max(1, Math.min(span, BUF_LEN - 1));
    ui.fascia.max = max;
    if (val(ui.fascia) > max) ui.fascia.value = max;
    syncOutputs();
  }

  // ---- buffer ----------------------------------------------------------------
  function neededSize() {
    const vw = video.videoWidth, vh = video.videoHeight;
    return isCol() ? { w: BUF_LEN, h: vh } : { w: vw, h: BUF_LEN };
  }

  function clearBuffer() {
    actx.fillStyle = '#fff';
    actx.fillRect(0, 0, acc.width, acc.height);
    render();
  }

  // riallocca solo se le dimensioni cambiano (altrimenti l'immagine continua)
  function allocate() {
    const { w, h } = neededSize();
    if (!hasAlloc || acc.width !== w || acc.height !== h) {
      acc.width = out.width = w;
      acc.height = out.height = h;
      hasAlloc = true;
      clearBuffer();
    }
  }

  // ---- acquisizione ------------------------------------------------------------
  function step() {
    const vw = video.videoWidth, vh = video.videoHeight;
    const f = val(ui.fascia);
    if (isCol()) {
      // sposta a destra e copia la nuova colonna centrale a sinistra
      actx.drawImage(acc, 0, 0, BUF_LEN - f, vh, f, 0, BUF_LEN - f, vh);
      const sx = Math.floor(vw / 2 - f / 2);
      actx.drawImage(video, sx, 0, f, vh, 0, 0, f, vh);
    } else {
      // sposta in basso e copia la nuova riga centrale in alto
      actx.drawImage(acc, 0, 0, vw, BUF_LEN - f, 0, f, vw, BUF_LEN - f);
      const sy = Math.floor(vh / 2 - f / 2);
      actx.drawImage(video, 0, sy, vw, f, 0, 0, vw, f);
    }
  }

  function render() {
    if (!acc.width || !acc.height) return;
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(acc, 0, 0);
    const r = val(ui.r), g = val(ui.g), b = val(ui.b);
    if (r !== 255 || g !== 255 || b !== 255) {
      ctx.globalCompositeOperation = 'multiply';    // come tint() di Processing
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fillRect(0, 0, out.width, out.height);
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  function loop(now) {
    if (!running) return;
    if (video.readyState >= 2 && now - lastShift >= val(ui.time)) {
      lastShift = now;
      step();
      render();
    }
    rafId = requestAnimationFrame(loop);
  }

  // ---- fotocamera --------------------------------------------------------------
  async function listCameras(currentId) {
    try {
      const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
      const prev = ui.cam.value;
      ui.cam.innerHTML = '';
      devs.forEach((d, i) => {
        const o = document.createElement('option');
        o.value = d.deviceId;
        o.textContent = d.label || ('Fotocamera ' + (i + 1));
        ui.cam.appendChild(o);
      });
      if (!devs.length) ui.cam.innerHTML = '<option value="">Nessuna fotocamera</option>';
      ui.cam.value = currentId || prev;
      if (ui.cam.value !== (currentId || prev) && devs.length) ui.cam.selectedIndex = 0;
    } catch (e) { /* elenco non disponibile: resta "Predefinita" */ }
  }

  function stopStream() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
  }

  async function start() {
    stopStream();
    try {
      const constraints = { audio: false, video: { width: { ideal: 1920 }, height: { ideal: 1080 } } };
      if (ui.cam.value) constraints.video.deviceId = { exact: ui.cam.value };
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      await video.play();

      const currentId = stream.getVideoTracks()[0].getSettings().deviceId;
      await listCameras(currentId);      // dopo il permesso le etichette sono disponibili

      updateFasciaMax();
      allocate();
      running = true;
      lastShift = 0;
      ui.start.textContent = 'Arresta';
      ui.start.classList.add('on');
      setStatus(`Acquisizione in corso: ${video.videoWidth}×${video.videoHeight}, ` +
                (isCol() ? 'colonna' : 'riga') + '.');
      cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(loop);
    } catch (e) {
      running = false;
      ui.start.textContent = 'Avvia';
      ui.start.classList.remove('on');
      setStatus('Impossibile accedere alla fotocamera: ' + e.message +
                ' (serve https o localhost e il permesso della camera).', true);
    }
  }

  function stop() {
    running = false;
    cancelAnimationFrame(rafId);
    stopStream();                         // spegne la fotocamera, l'immagine resta
    ui.start.textContent = 'Avvia';
    ui.start.classList.remove('on');
    setStatus('Arrestato. L\'immagine è conservata: puoi salvarla, cancellarla o riavviare.');
  }

  function save() {
    if (!acc.width) return;
    render();
    const a = document.createElement('a');
    a.href = out.toDataURL('image/png');
    a.download = 'slitcam_' + Date.now() + '.png';
    a.click();
  }

  // ---- eventi ------------------------------------------------------------------
  ui.start.addEventListener('click', () => running ? stop() : start());
  ui.clear.addEventListener('click', () => { if (acc.width) clearBuffer(); });
  ui.save.addEventListener('click', save);

  [ui.time, ui.fascia, ui.r, ui.g, ui.b].forEach(el =>
    el.addEventListener('input', () => { syncOutputs(); if (!running) render(); }));

  ui.cam.addEventListener('change', () => { if (running) start(); });

  ui.mode.addEventListener('change', () => {
    updateFasciaMax();
    if (running) {
      allocate();                         // nuove dimensioni: l'immagine riparte da zero
      setStatus('Modalità cambiata: ' + (isCol() ? 'colonna' : 'riga') + '.');
    } else {
      hasAlloc = false;                   // verrà riallocato al prossimo avvio
    }
  });

  window.addEventListener('keydown', (e) => {
    const t = e.target.tagName;
    if (t === 'SELECT') return;
    const bump = (el, d) => { el.value = clamp(val(el) + d, +el.min, +el.max); el.dispatchEvent(new Event('input')); };
    switch (e.key) {
      case ' ': if (t !== 'BUTTON') { e.preventDefault(); running ? stop() : start(); } return;
      case 'e': bump(ui.fascia, 10); break;
      case 'r': bump(ui.fascia, -10); break;
      case 'd': bump(ui.time, 10); break;
      case 'f': bump(ui.time, -10); break;
      case 'y': bump(ui.r, 10); break;
      case 'u': bump(ui.r, -10); break;
      case 'h': bump(ui.g, 10); break;
      case 'j': bump(ui.g, -10); break;
      case 'n': bump(ui.b, 10); break;
      case 'm': bump(ui.b, -10); break;
      case 's': save(); break;
      case 'c': if (acc.width) clearBuffer(); break;
    }
  });

  // se la camera cambia durante la sessione (collegamento/scollegamento)
  if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
    navigator.mediaDevices.addEventListener('devicechange', () => listCameras(ui.cam.value));
  }

  syncOutputs();
  listCameras();
})();
</script>
</body>
</html>
